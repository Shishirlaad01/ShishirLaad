<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Chat Conversations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314171f'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='800' fill='%23c8752f' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14171f; --cream: #f6f4ef; --card: #ffffff;
    --rose: #d94f7a; --amber: #c8752f; --amber-soft: rgba(200,117,47,0.12);
    --text: #191c24; --muted: #6b6f7b; --soft: #9aa0ad;
    --border: rgba(20,23,31,0.09); --selected: #fbf3ea;
    --bubble-user: #14171f; --bubble-user-text: #fff; --bubble-bot: #f1eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #0f1117; --card: #181b23; --text: #eceae6; --muted: #a2a6b1; --soft: #7c818d;
      --border: rgba(255,255,255,0.09); --selected: #251d16; --amber-soft: rgba(226,160,92,0.14);
      --bubble-user: #c8752f; --bubble-user-text: #1a1108; --bubble-bot: #22262f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, .stat b { font-family: 'Plus Jakarta Sans', sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  header.top { background: var(--ink); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header.top h1 { font-size: 1.15rem; font-weight: 800; }
  header.top h1 span { color: #e2a05c; }
  header.top .spacer { flex: 1; }
  .ghost { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.85rem; }
  .ghost:hover { border-color: #e2a05c; }

  /* sign-in */
  .login { max-width: 380px; margin: 12vh auto; padding: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-inline: 16px; }
  @media (min-width: 420px) { .login { margin-inline: auto; } }
  .login h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .login p { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  .login input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--cream); margin-bottom: 12px; }
  .login input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .primary { background: var(--amber); color: #1a1108; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 600; cursor: pointer; }
  .primary:hover { background: #e2a05c; }
  .error { color: var(--rose); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

  /* stats + filters */
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 40px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat b { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 0.8rem; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters input, .filters select { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 0.88rem; }
  .filters input { flex: 1; min-width: 200px; }

  /* list + detail */
  .layout { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 16px; align-items: start; }
  .list { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border); padding: 13px 16px; cursor: pointer; }
  .item:hover { background: var(--amber-soft); }
  .item[aria-current="true"] { background: var(--selected); box-shadow: inset 3px 0 0 var(--amber); }
  .item .q { font-weight: 600; font-size: 0.92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { color: var(--muted); font-size: 0.78rem; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-block; background: var(--amber-soft); color: var(--amber); border-radius: 999px; padding: 0 8px; font-size: 0.72rem; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .tag { color: #e2a05c; } }
  .more { display: block; width: 100%; padding: 12px; background: none; border: 0; color: var(--amber); font-weight: 600; cursor: pointer; }
  .empty { padding: 28px 18px; color: var(--muted); text-align: center; font-size: 0.9rem; }

  .detail { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .detail h2 { font-size: 1.05rem; margin-bottom: 10px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 18px; padding: 12px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .facts dt { color: var(--soft); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .facts dd { font-size: 0.88rem; overflow-wrap: anywhere; }
  .exchange { margin-bottom: 14px; }
  .time { color: var(--soft); font-size: 0.72rem; margin: 0 0 4px; text-align: center; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 6px; }
  .bubble.user { background: var(--bubble-user); color: var(--bubble-user-text); margin-left: auto; border-bottom-right-radius: 4px; }
  .bubble.bot { background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .bubble.failed { border: 1px dashed var(--rose); }
  .flag { color: var(--rose); font-size: 0.75rem; }
  .back { display: none; margin-bottom: 12px; background: none; border: 0; color: var(--amber); font-weight: 600; cursor: pointer; }

  @media (max-width: 820px) {
    main { padding: 16px; }
    .layout { grid-template-columns: 1fr; }
    .detail { position: static; max-height: none; }
    .layout.showing-detail .list { display: none; }
    .layout:not(.showing-detail) .detail { display: none; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Chat <span>conversations</span></h1>
  <div class="spacer"></div>
  <button class="ghost" id="refresh" hidden>Refresh</button>
  <button class="ghost" id="signout" hidden>Sign out</button>
</header>

<form class="login" id="login" hidden>
  <h2>Private page</h2>
  <p>Enter your STATS_TOKEN to read the chatbot's saved conversations.</p>
  <input type="password" id="token" autocomplete="current-password" placeholder="STATS_TOKEN" aria-label="STATS_TOKEN" required>
  <button class="primary" type="submit">Open</button>
  <p class="error" id="login-error" role="alert"></p>
</form>

<main id="app" hidden>
  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="s-total">–</b><span>Conversations (last 90 days)</span></div>
    <div class="stat"><b id="s-week">–</b><span>In the last 7 days</span></div>
    <div class="stat"><b id="s-source">–</b><span>Top source (loaded)</span></div>
    <div class="stat"><b id="s-country">–</b><span>Top country (loaded)</span></div>
  </section>
  <div class="filters">
    <input type="search" id="search" placeholder="Search questions, city, source…" aria-label="Search conversations">
    <select id="f-source" aria-label="Filter by source"><option value="">All sources</option></select>
    <select id="f-device" aria-label="Filter by device"><option value="">All devices</option></select>
  </div>
  <div class="layout" id="layout">
    <div class="list" id="list" role="list"></div>
    <section class="detail" id="detail" aria-live="polite">
      <p class="empty">Pick a conversation to read it.</p>
    </section>
  </div>
  <p class="error" id="app-error" role="alert"></p>
</main>

<script>
(() => {
  const KEY = 'chats_admin_token';
  const $ = (id) => document.getElementById(id);
  let token = '';
  try { token = sessionStorage.getItem(KEY) || ''; } catch {}
  let conversations = [];
  let nextOffset = 0;
  let selectedId = null;

  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c); // strings become text nodes: no HTML injection
    return node;
  };

  const flag = (cc) => /^[A-Z]{2}$/.test(cc || '') ? String.fromCodePoint(...[...cc].map(c => 0x1f1a5 + c.charCodeAt(0))) + ' ' : '';
  let regionNames;
  try { regionNames = new Intl.DisplayNames(undefined, { type: 'region' }); } catch {}
  const countryName = (cc) => { if (!cc || cc === 'unknown') return 'Unknown'; try { return regionNames?.of(cc) || cc; } catch { return cc; } };
  const place = (c) => [c.city, countryName(c.country)].filter(Boolean).join(', ');
  const when = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const mins = (Date.now() - d) / 60000;
    if (mins < 1) return 'just now';
    if (mins < 60) return `${Math.floor(mins)} min ago`;
    if (mins < 60 * 24) return `${Math.floor(mins / 60)} h ago`;
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  };
  const fullTime = (iso) => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';

  async function api(query) {
    const res = await fetch(`/api/chats${query}`, { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' });
    if (res.status === 401) { signOut('That token was not accepted.'); throw new Error('unauthorized'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function signOut(message = '') {
    token = '';
    try { sessionStorage.removeItem(KEY); } catch {}
    $('app').hidden = true; $('refresh').hidden = true; $('signout').hidden = true;
    $('login').hidden = false; $('login-error').textContent = message;
    $('token').value = ''; $('token').focus();
  }

  async function start() {
    $('login').hidden = true; $('app').hidden = false;
    $('refresh').hidden = false; $('signout').hidden = false;
    conversations = []; nextOffset = 0;
    await loadMore();
    if (location.hash.length > 1) openConversation(location.hash.slice(1));
  }

  async function loadMore() {
    if (nextOffset === null) return;
    $('app-error').textContent = '';
    try {
      const data = await api(`?offset=${nextOffset}`);
      conversations.push(...data.conversations);
      nextOffset = data.nextOffset;
      $('s-total').textContent = data.total;
      $('s-week').textContent = data.lastWeek;
      renderFilters(); renderStats(); renderList();
    } catch (err) {
      if (err.message !== 'unauthorized') $('app-error').textContent = `Could not load conversations: ${err.message}`;
    }
  }

  function top(field, fmt = (v) => v) {
    const counts = {};
    for (const c of conversations) counts[c[field]] = (counts[c[field]] || 0) + 1;
    const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return best ? fmt(best[0]) : '–';
  }
  function renderStats() {
    $('s-source').textContent = top('source');
    $('s-country').textContent = top('country', (cc) => flag(cc) + countryName(cc));
  }

  function renderFilters() {
    for (const [id, field] of [['f-source', 'source'], ['f-device', 'device']]) {
      const select = $(id);
      const current = select.value;
      const values = [...new Set(conversations.map(c => c[field]).filter(Boolean))].sort();
      select.replaceChildren(select.options[0], ...values.map(v => el('option', { value: v }, v)));
      select.value = values.includes(current) ? current : '';
    }
  }

  function visible() {
    const q = $('search').value.trim().toLowerCase();
    const source = $('f-source').value;
    const device = $('f-device').value;
    return conversations.filter(c =>
      (!source || c.source === source) && (!device || c.device === device) &&
      (!q || [c.firstQuestion, c.city, countryName(c.country), c.source, c.referrer, c.landing].join(' ').toLowerCase().includes(q)));
  }

  function renderList() {
    const items = visible();
    const list = $('list');
    list.replaceChildren(
      ...items.map(c => el('button', {
          class: 'item', role: 'listitem', type: 'button',
          'aria-current': String(c.id === selectedId), onclick: () => openConversation(c.id),
        },
        el('div', { class: 'q' }, c.firstQuestion || '(no question saved)'),
        el('div', { class: 'meta' },
          el('span', {}, when(c.updated)),
          el('span', {}, flag(c.country) + place(c)),
          el('span', { class: 'tag' }, c.source),
          el('span', {}, `${c.device} · ${c.turns} msg${c.turns === 1 ? '' : 's'}`)),
      )),
    );
    if (items.length === 0) {
      list.append(el('p', { class: 'empty' }, conversations.length ? 'No conversations match these filters.' : 'No conversations saved yet. They appear here after a visitor chats.'));
    }
    if (nextOffset !== null) list.append(el('button', { class: 'more', type: 'button', onclick: loadMore }, 'Load older conversations'));
  }

  async function openConversation(id) {
    selectedId = id;
    history.replaceState(null, '', `#${id}`);
    renderList();
    $('layout').classList.add('showing-detail');
    const detail = $('detail');
    detail.replaceChildren(el('p', { class: 'empty' }, 'Loading…'));
    try {
      const c = await api(`?id=${encodeURIComponent(id)}`);
      const facts = [
        ['Started', fullTime(c.started)],
        ['Last message', fullTime(c.updated)],
        ['Location', flag(c.country) + [c.city, c.region, countryName(c.country)].filter(Boolean).join(', ')],
        ['Came from', c.source + (c.referrer && !c.referrer.toLowerCase().includes(c.source.toLowerCase()) ? ` (${c.referrer})` : '')],
        ['Landing page', c.landing],
        ['Device', c.device],
      ];
      detail.replaceChildren(
        el('button', { class: 'back', type: 'button', onclick: () => { $('layout').classList.remove('showing-detail'); selectedId = null; history.replaceState(null, '', location.pathname); renderList(); } }, '← All conversations'),
        el('h2', {}, `${c.exchanges.length} exchange${c.exchanges.length === 1 ? '' : 's'}`),
        el('dl', { class: 'facts' }, ...facts.map(([k, v]) => el('div', {}, el('dt', {}, k), el('dd', {}, v || '–')))),
        ...c.exchanges.map(x => {
          const failed = x.stop === 'error' || x.stop === 'visitor_left';
          return el('div', { class: 'exchange' },
            el('p', { class: 'time' }, fullTime(x.at)),
            el('div', { class: 'bubble user' }, x.user),
            x.assistant || !failed ? el('div', { class: `bubble bot${failed ? ' failed' : ''}` }, x.assistant || '(empty reply)') : null,
            failed ? el('p', { class: 'flag' }, x.stop === 'error' ? 'The reply failed, so the visitor saw an error notice.' : 'The visitor left before the reply finished.') : null,
          );
        }),
      );
    } catch (err) {
      if (err.message !== 'unauthorized') detail.replaceChildren(el('p', { class: 'empty' }, `Could not open this conversation: ${err.message}`));
    }
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    try { sessionStorage.setItem(KEY, token); } catch {}
    start();
  });
  $('signout').addEventListener('click', () => signOut());
  $('refresh').addEventListener('click', start);
  for (const id of ['search', 'f-source', 'f-device']) $(id).addEventListener('input', renderList);

  if (token) start(); else signOut();
})();
</script>
</body>
</html>
